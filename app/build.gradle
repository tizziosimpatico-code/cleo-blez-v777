plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.cleo.blebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.cleo.blebridge"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1-fase1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.2'

    // Fotocamera
    implementation 'androidx.camera:camera-core:1.3.1'
    implementation 'androidx.camera:camera-camera2:1.3.1'
    implementation 'androidx.camera:camera-lifecycle:1.3.1'
    implementation 'androidx.camera:camera-view:1.3.1'

    // OCR (riconoscimento testo su dispositivo, funziona anche senza internet)
    implementation 'com.google.mlkit:text-recognition:16.0.0'

    // Webcam USB (UVC) - UVCAndroid, la stessa base tecnologica dell'app "USB Camera"
    // che funziona già sul tablet. Distribuita su Maven Central (più affidabile di JitPack).
    implementation 'com.herohan:UVCAndroid:1.0.13'
}
